name: Generate release tag

on:
  workflow_call:
    inputs:
      short_description:
        type: string
        required: true
      planned_startdate:
        type: string
        required: true
      planned_enddate:
        type: string
        required: true
      release_note:
        type: string
        required: true
      environment:
        type: string
        required: true
        default: "PROD"
    outputs:
      release_tag:
        description: 'The unique release tag'
        value: ${{ jobs.generate-tag.outputs.release_tag }}
      release_id:
        description: 'The unique release ID'
        value: ${{ jobs.generate-tag.outputs.release_id }}

jobs:
  generate-tag:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.vars.outputs.release_tag }}
      release_id: ${{ steps.vars.outputs.release_id }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Get ARM Access Token
        run: |
          RESPONSE=$(curl -s -X POST \
            "${{secrets.ARM_COGNITO_ENDPOINT}}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -u "${{ secrets.ARM_COGNITO_CLIENTID }}:${{ secrets.ARM_COGNITO_CLIENTSECRET }}" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "scope=bridge-api/arm-register-release")

          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')

          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            echo "Failed to obtain access token"
            echo "$RESPONSE"
            exit 1
          fi

          echo "ARM_TOKEN=$TOKEN" >> $GITHUB_ENV
      
      - name: Register Release
        id: vars
        run: |
          RESPONSE=$(curl -X POST \
            "${{secrets.ARM_HOST}}/prod/arm/register/release" \
            -H "Authorization: Bearer $ARM_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "application_name": "Glow-Portals",
              "arm_environment": "${{ inputs.environment }}",
              "requested_by": "${{ github.actor }}",
              "servicenow_change": {
                "planned_startdate": "${{ inputs.planned_startdate }}",
                "planned_enddate": "${{ inputs.planned_enddate }}",
                "time_zone": "Europe/Amsterdam",
                "users_affected": "<1000",
                "short_description": "${{ inputs.short_description }}",
                "description": "${{ inputs.release_note }}",
                "implementation_plan": "implementation plan",
                "test_plan": "test plan",
                "backout_plan": "backout plan",
                "risk_impact_analysis": "Risk impact analysis"
              }
            }')

            release_id=$(echo "$RESPONSE" | jq -r '.release_id')
            if [ "$release_id" = "null" ] || [ -z "$release_id" ]; then
              echo "Failed to register ARM release"
              echo "$RESPONSE"
              exit 1
            fi
          
            echo "release_id=$release_id" >> $GITHUB_OUTPUT
            FULL_HASH=$(git rev-parse --short HEAD)
            echo "release_tag=$FULL_HASH" >> $GITHUB_OUTPUT

            echo "Generated release ID: $release_id"
            echo "Generated release tag: $FULL_HASH"


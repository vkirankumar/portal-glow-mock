name: Generate release tag

on:
  workflow_call:
    outputs:
      release_tag:
        description: 'The unique release tag'
        value: ${{ jobs.generate-tag.outputs.release_tag }}

jobs:
  generate-tag:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.vars.outputs.release_tag }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate input
        id: vars
        run: |
              response=$(curl -X POST \
              -H "Content-Type: application/json" \
              https://yfoa5flvfk.execute-api.us-east-1.amazonaws.com/staging/generate-release-id \
              -d '{
                  "platform": "git",
                  "env": "prod"
              }')
              echo "Response: $response"
              status=$(echo "$response" | jq -r '.status')
              if [ "$status" -ne 200 ]; then
                echo "Error: API call failed with status $status"
                exit 1
              fi
              release_id=$(echo "$response" | jq -r '.release_id')
              echo "release_tag=$release_id" >> $GITHUB_OUTPUT
            # FULL_HASH=$(git rev-parse --short HEAD)
            # UNIQUE_ID=_${{ github.run_id }}
            
            # echo "release_tag=$FULL_HASH$UNIQUE_ID" >> $GITHUB_OUTPUT


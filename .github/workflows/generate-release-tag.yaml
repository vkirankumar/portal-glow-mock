name: Generate release tag

on:
  workflow_call:
    inputs:
      short_description:
        type: string
        required: true
      planned_startdate:
        type: string
        required: true
      planned_enddate:
        type: string
        required: true
      release_note:
        type: string
        required: true
      environment:
        type: string
        required: true
        default: "PROD"
      change_type:
        type: string
        required: true
      urgency:
        type: string
        required: true
      fixed_incident:
        type: string
      outage_startdate:
        type: string
      outage_enddate:
        type: string
      customer_affected:
        type: string
        required: true
    outputs:
      release_tag:
        description: 'The unique release tag'
        value: ${{ jobs.generate-tag.outputs.release_tag }}
      release_id:
        description: 'The unique release ID'
        value: ${{ jobs.generate-tag.outputs.release_id }}

jobs:
  generate-tag:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.vars.outputs.release_tag }}
      release_id: ${{ steps.vars.outputs.release_id }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Get ARM Access Token
        run: |
          RESPONSE=$(curl -s -X POST \
            "${{secrets.ARM_COGNITO_ENDPOINT}}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -u "${{ secrets.ARM_COGNITO_CLIENTID }}:${{ secrets.ARM_COGNITO_CLIENTSECRET }}" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "scope=bridge-api/arm-register-release")

          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')

          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            echo "Failed to obtain access token"
            echo "$RESPONSE"
            exit 1
          fi

          echo "ARM_TOKEN=$TOKEN" >> $GITHUB_ENV
      
      - name: Register Release
        id: vars
        env:
          ARM_HOST: ${{ secrets.ARM_HOST }}
          ARM_TOKEN: ${{ env.ARM_TOKEN }}

          APPLICATION_NAME: "Portals-Glow"
          ARM_ENVIRONMENT: ${{ inputs.environment }}
          REQUESTED_BY: ${{ github.actor }}

          PLANNED_STARTDATE: ${{ inputs.planned_startdate }}
          PLANNED_ENDDATE: ${{ inputs.planned_enddate }}
          SHORT_DESCRIPTION: ${{ inputs.short_description }}
          RELEASE_NOTE: ${{ inputs.release_note }}

          CHANGE_TYPE: ${{ inputs.change_type }}
          URGENCY: ${{ inputs.urgency }}
          CUSTOMER_AFFECTED: ${{ inputs.customer_affected }}

          FIXED_INCIDENT: ${{ inputs.fixed_incident }}
          OUTAGE_STARTDATE: ${{ inputs.outage_startdate }}
          OUTAGE_ENDDATE: ${{ inputs.outage_enddate }}
        run: |
          REQUEST_BODY=$(jq -n \
            --arg application_name "$APPLICATION_NAME" \
            --arg arm_environment "$ARM_ENVIRONMENT" \
            --arg requested_by "$REQUESTED_BY" \
            --arg planned_startdate "$PLANNED_STARTDATE" \
            --arg planned_enddate "$PLANNED_ENDDATE" \
            --arg time_zone "Europe/Amsterdam" \
            --arg short_description "$SHORT_DESCRIPTION" \
            --arg description "$RELEASE_NOTE" \
            --arg implementation_plan "implementation plan" \
            --arg test_plan "test plan" \
            --arg backout_plan "backout plan" \
            --arg risk_impact_analysis "Risk impact analysis" \
            --arg change_type "$CHANGE_TYPE" \
            --arg urgency "$URGENCY" \
            --arg customer_affected "$CUSTOMER_AFFECTED" \
            --arg fixed_incident "$FIXED_INCIDENT" \
            --arg outage_startdate "$OUTAGE_STARTDATE" \
            --arg outage_enddate "$OUTAGE_ENDDATE" \
            '
            {
              application_name: $application_name,
              arm_environment: $arm_environment,
              requested_by: $requested_by,

              servicenow_change: {
                planned_startdate: $planned_startdate,
                planned_enddate: $planned_enddate,
                time_zone: $time_zone,
                short_description: $short_description,
                description: $description,
                implementation_plan: $implementation_plan,
                test_plan: $test_plan,
                backout_plan: $backout_plan,
                risk_impact_analysis: $risk_impact_analysis,
                change_type: $change_type,
                urgency: $urgency,
                customer_affected: $customer_affected
              }
            }

            # Add fixed incident only when supplied
            | if $fixed_incident != ""
              then .servicenow_change.fixed_incident = $fixed_incident
              else .
              end

            # Add outage dates only for outage/service degraded
            | if $urgency == "OUTAGE" or $urgency == "SERVICE_DEGRADED"
              then
                .servicenow_change.outage_startdate = $outage_startdate |
                .servicenow_change.outage_enddate = $outage_enddate
              else .
              end
            ')

          echo "Request body:"
          echo "$REQUEST_BODY" | jq .

          RESPONSE=$(curl -sS -X POST \
            "$ARM_HOST/prod/arm/register/release" \
            -H "Authorization: Bearer $ARM_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY")

          echo "Response: $RESPONSE"

          release_id=$(echo "$RESPONSE" | jq -r '.release_id')

          if [ "$release_id" = "null" ] || [ -z "$release_id" ]; then
            echo "Failed to register ARM release"
            echo "$RESPONSE"
            exit 1
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

          FULL_HASH=$(git rev-parse --short HEAD)

          echo "release_tag=$FULL_HASH" >> "$GITHUB_OUTPUT"

          echo "Generated release ID: $release_id"
          echo "Generated release tag: $FULL_HASH"


name: Generate release tag

on:
  workflow_call:
    inputs:
      short_description:
        type: string
        required: true
      planned_startdate:
        type: string
        required: true
      planned_enddate:
        type: string
        required: true
      release_note:
        type: string
        required: true
      environment:
        type: string
        required: true
        default: "PROD"
      change_type:
        type: string
        required: true
      urgency:
        type: string
        required: true
      fixed_incident:
        type: string
      outage_startdate:
        type: string
      outage_enddate:
        type: string
      customer_affected:
        type: string
        required: true
    outputs:
      release_tag:
        description: 'The unique release tag'
        value: ${{ jobs.generate-tag.outputs.release_tag }}
      release_id:
        description: 'The unique release ID'
        value: ${{ jobs.generate-tag.outputs.release_id }}

jobs:
  generate-tag:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.vars.outputs.release_tag }}
      release_id: ${{ steps.vars.outputs.release_id }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Get ARM Access Token
        run: |
          RESPONSE=$(curl -s -X POST \
            "${{secrets.ARM_COGNITO_ENDPOINT}}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -u "${{ secrets.ARM_COGNITO_CLIENTID }}:${{ secrets.ARM_COGNITO_CLIENTSECRET }}" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "scope=bridge-api/arm-register-release")

          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')

          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            echo "Failed to obtain access token"
            echo "$RESPONSE"
            exit 1
          fi

          echo "ARM_TOKEN=$TOKEN" >> $GITHUB_ENV
      
      - name: Register Release
        id: vars
        run: |
          # Base ServiceNow change request
          CHANGE_REQUEST=$(jq -n \
            --arg planned_startdate "$PLANNED_STARTDATE" \
            --arg planned_enddate "$PLANNED_ENDDATE" \
            --arg short_description "$SHORT_DESCRIPTION" \
            --arg release_note "$RELEASE_NOTE" \
            --arg change_type "$CHANGE_TYPE" \
            --arg urgency "$URGENCY" \
            --arg customer_affected "$CUSTOMER_AFFECTED" \
            '{
              planned_startdate: $planned_startdate,
              planned_enddate: $planned_enddate,
              time_zone: "Europe/Amsterdam",
              short_description: $short_description,
              description: $release_note,
              implementation_plan: "implementation plan",
              test_plan: "test plan",
              backout_plan: "backout plan",
              risk_impact_analysis: "Risk impact analysis",
              change_type: $change_type,
              urgency: $urgency,
              customer_affected: $customer_affected
            }')

          # Add fixed incident only when supplied
          if [ -n "$FIXED_INCIDENT" ]; then
            CHANGE_REQUEST=$(echo "$CHANGE_REQUEST" | jq \
              --arg fixed_incident "$FIXED_INCIDENT" \
              '. + {fixed_incident: $fixed_incident}')
          fi

          # Outage dates are required only for OUTAGE / SERVICE_DEGRADED
          if [ "$URGENCY" = "OUTAGE" ] || [ "$URGENCY" = "SERVICE_DEGRADED" ]; then

            if [ -z "$OUTAGE_STARTDATE" ] || [ -z "$OUTAGE_ENDDATE" ]; then
              echo "ERROR: outage_startdate and outage_enddate are required when urgency is $URGENCY"
              exit 1
            fi

            CHANGE_REQUEST=$(echo "$CHANGE_REQUEST" | jq \
              --arg outage_startdate "$OUTAGE_STARTDATE" \
              --arg outage_enddate "$OUTAGE_ENDDATE" \
              '. + {
                outage_startdate: $outage_startdate,
                outage_enddate: $outage_enddate
              }')
          fi

          # Build complete ARM request
          REQUEST_BODY=$(jq -n \
            --arg application_name "$APPLICATION_NAME" \
            --arg arm_environment "$ARM_ENVIRONMENT" \
            --arg requested_by "$REQUESTED_BY" \
            --argjson servicenow_change "$CHANGE_REQUEST" \
            '{
              application_name: $application_name,
              arm_environment: $arm_environment,
              requested_by: $requested_by,
              servicenow_change: $servicenow_change
            }')

          echo "Registering ARM release..."
          echo "$REQUEST_BODY" | jq .

          RESPONSE=$(curl -sS -X POST \
            "${{ secrets.ARM_HOST }}/prod/arm/register/release" \
            -H "Authorization: Bearer $ARM_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY")

          echo "Response: $RESPONSE"

          release_id=$(echo "$RESPONSE" | jq -r '.release_id // empty')

          if [ -z "$release_id" ]; then
            echo "Failed to register ARM release"
            echo "$RESPONSE"
            exit 1
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

          FULL_HASH=$(git rev-parse --short HEAD)
          echo "release_tag=$FULL_HASH" >> "$GITHUB_OUTPUT"

          echo "Generated release ID: $release_id"
          echo "Generated release tag: $FULL_HASH"


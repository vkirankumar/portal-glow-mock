name: Deploy to prod

on:
  workflow_dispatch:
    inputs:
      short_description:
        description: "ServiceNow short description"
        type: string
        required: true
        default: "Test ARM Deploy - Glow Portals"
      planned_startdate:
        description: "Planned Start Date Time (UTC), Format: YYYY-mm-DDTHH:MM:SSZ => 2026-08-12T20:00:00Z"
        type: string
        required: true
        default: "2026-08-12T20:00:00Z"
      planned_enddate:
        description: "Planned End Date Time (UTC), Format: YYYY-mm-DDTHH:MM:SSZ => 2026-08-12T20:30:00Z"
        type: string
        required: true
        default: "2026-08-12T20:30:00Z"
      environment:
        description: "Environment to deploy to"
        type: choice
        required: true
        default: "PROD"
        options:
          - PROD
          - DEV
      release_note:
        description: "Confluence link to release notes"
        type: string
        required: true
        default: "https://confluence.odido.nl/release_note.html"

jobs:
  generate-release-tag:
    uses: ./.github/workflows/generate-release-tag.yaml
    with:
      short_description: ${{ inputs.short_description }}
      planned_startdate: ${{ inputs.planned_startdate }}
      planned_enddate: ${{ inputs.planned_enddate }}
      release_note: ${{ inputs.release_note }}
      environment: ${{ inputs.environment }}
    secrets: inherit

  build-publish-docker:
    needs: generate-release-tag
    runs-on: ubuntu-latest
    steps:
      - name: Print release tag
        run: echo "Release Tag = ${{ needs.generate-release-tag.outputs.release_tag}}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v3

      # - name: Set up Docker Buildx
      #   uses: docker/setup-buildx-action@v3

      # - name: Build and push
      #   uses: docker/build-push-action@v6
      #   with:
      #     push: true
      #     tags: ${{ secrets.DOCKERHUB_USERNAME }}/glow-portals:${{ needs.generate-release-tag.outputs.release_tag }}

  chart-tagger:
    needs: [generate-release-tag, build-publish-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch chart tagger event
        run: |
          echo "release_tag=${{ needs.generate-release-tag.outputs.release_tag }}"
          response=$(curl -X POST \
              -H "Authorization: Bearer ${{ secrets.CLASSIC_PAT_CROSS_REPO }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/vkirankumar/portal-glow-mock-helm/dispatches \
              -d '{
                  "event_type": "helm_chart_image_tag_update",
                  "client_payload": {
                  "release_tag": "${{ needs.generate-release-tag.outputs.release_tag }}",
                  "release_id": "${{ needs.generate-release-tag.outputs.release_id }}",
                  "release_note": "${{ inputs.release_note }}"
                  }
              }')
              echo "Response: $response"
